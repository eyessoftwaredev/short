# Coolify "Docker Compose" resource for the Short platform.
#
# Runs the Next.js panel plus the three stateful dependencies. The redirect edge
# (apps/edge) and the queue consumer (apps/ingest) live on Cloudflare and are
# deployed with Wrangler, not from here.
#
# Coolify injects every variable below from the resource's environment tab; the
# `${VAR:?}` form fails the deploy early instead of booting a half-configured app.

services:
  web:
    build:
      context: ..
      dockerfile: infra/Dockerfile
    restart: unless-stopped
    environment:
      NODE_ENV: production
      APP_URL: ${APP_URL:?}
      SITE_URL: ${SITE_URL:-}
      BETTER_AUTH_URL: ${APP_URL:?}
      BETTER_AUTH_SECRET: ${BETTER_AUTH_SECRET:?}
      SECRET_ENCRYPTION_KEY: ${SECRET_ENCRYPTION_KEY:?}
      PLATFORM_SHORT_DOMAIN: ${PLATFORM_SHORT_DOMAIN:?}
      CUSTOM_HOSTNAME_TARGET: ${CUSTOM_HOSTNAME_TARGET:-cname.short.ky}
      DATABASE_URL: postgres://short:${POSTGRES_PASSWORD:?}@postgres:5432/short
      REDIS_URL: redis://default:${REDIS_PASSWORD:?}@redis:6379
      CLICKHOUSE_URL: http://clickhouse:8123
      CLICKHOUSE_DATABASE: short
      CLICKHOUSE_USER: default
      CLICKHOUSE_PASSWORD: ${CLICKHOUSE_PASSWORD:?}
      INTERNAL_TOKEN: ${INTERNAL_TOKEN:?}
      CRON_SECRET: ${CRON_SECRET:?}
      # Optional integrations — /admin/system reports each one as disabled when unset.
      CF_ACCOUNT_ID: ${CF_ACCOUNT_ID:-}
      CF_ZONE_ID: ${CF_ZONE_ID:-}
      CF_API_TOKEN: ${CF_API_TOKEN:-}
      CF_KV_NAMESPACE_ID: ${CF_KV_NAMESPACE_ID:-}
      CF_OAUTH_CLIENT_ID: ${CF_OAUTH_CLIENT_ID:-}
      CF_OAUTH_CLIENT_SECRET: ${CF_OAUTH_CLIENT_SECRET:-}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-}
      RESEND_API_KEY: ${RESEND_API_KEY:-}
      EMAIL_FROM: ${EMAIL_FROM:-Short <noreply@short.ky>}
      STRIPE_SECRET_KEY: ${STRIPE_SECRET_KEY:-}
      STRIPE_WEBHOOK_SECRET: ${STRIPE_WEBHOOK_SECRET:-}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      clickhouse:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "--show-error", "http://127.0.0.1:3000/api/health"]
      interval: 10s
      timeout: 5s
      start_period: 90s
      retries: 6
    stop_grace_period: 60s

  migrate:
    build:
      context: ..
      dockerfile: infra/Dockerfile.migrate
    restart: "no"
    exclude_from_hc: true
    environment:
      DATABASE_URL: postgres://short:${POSTGRES_PASSWORD:?}@postgres:5432/short
      CLICKHOUSE_URL: http://clickhouse:8123
      CLICKHOUSE_DATABASE: short
      CLICKHOUSE_USER: default
      CLICKHOUSE_PASSWORD: ${CLICKHOUSE_PASSWORD:?}
    depends_on:
      postgres:
        condition: service_healthy
      clickhouse:
        condition: service_healthy

  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: short
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?}
      POSTGRES_DB: short
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U short -d short"]
      interval: 10s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command:
      - redis-server
      - --requirepass
      - ${REDIS_PASSWORD:?}
      - --maxmemory
      - 512mb
      - --maxmemory-policy
      - allkeys-lru
      - --appendonly
      - "no"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a \"$$REDIS_PASSWORD\" ping | grep -q PONG"]
      interval: 10s
      timeout: 5s
      retries: 10
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:?}

  clickhouse:
    image: clickhouse/clickhouse-server:25.3-alpine
    restart: unless-stopped
    environment:
      CLICKHOUSE_DB: short
      CLICKHOUSE_USER: default
      CLICKHOUSE_PASSWORD: ${CLICKHOUSE_PASSWORD:?}
      CLICKHOUSE_DEFAULT_ACCESS_MANAGEMENT: "1"
    ulimits:
      nofile:
        soft: 262144
        hard: 262144
    volumes:
      - clickhouse-data:/var/lib/clickhouse
      - clickhouse-logs:/var/log/clickhouse-server
      - ./clickhouse/config.d:/etc/clickhouse-server/config.d:ro
      - ./clickhouse/users.d:/etc/clickhouse-server/users.d:ro
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://127.0.0.1:8123/ping"]
      interval: 15s
      timeout: 5s
      retries: 10

volumes:
  postgres-data:
  redis-data:
  clickhouse-data:
  clickhouse-logs:
