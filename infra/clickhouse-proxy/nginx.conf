# TLS terminates at Traefik; this container only proxies HTTP to ClickHouse.
# Docker's embedded DNS can change container IPs after redeploys — resolver +
# a variable upstream forces nginx to re-resolve short-clickhouse on each request.
resolver 127.0.0.11 valid=10s ipv6=off;

server {
  listen 80;

  location / {
    set $upstream http://short-clickhouse:8123;
    proxy_pass $upstream;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_read_timeout 30s;
  }
}
