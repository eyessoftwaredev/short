# Coolify default compose path. Keep in sync with infra/compose.yaml
# (this file uses repo-root build context; infra/compose.yaml uses context: ..).

services:
  web:
    build:
      context: .
      dockerfile: infra/Dockerfile
    restart: unless-stopped
    environment:
      NODE_ENV: production
      APP_URL: ${APP_URL:?}
      BETTER_AUTH_URL: ${APP_URL:?}
      BETTER_AUTH_SECRET: ${BETTER_AUTH_SECRET:?}
      PLATFORM_SHORT_DOMAIN: ${PLATFORM_SHORT_DOMAIN:?}
      CUSTOM_HOSTNAME_TARGET: ${CUSTOM_HOSTNAME_TARGET:-cname.short.ky}
      DATABASE_URL: postgres://short:${POSTGRES_PASSWORD:?}@postgres:5432/short
      REDIS_URL: redis://default:${REDIS_PASSWORD:?}@redis:6379
      CLICKHOUSE_URL: http://clickhouse:8123
      CLICKHOUSE_DATABASE: short
      CLICKHOUSE_USER: default
      CLICKHOUSE_PASSWORD: ${CLICKHOUSE_PASSWORD:?}
      INTERNAL_TOKEN: ${INTERNAL_TOKEN:?}
      CRON_SECRET: ${CRON_SECRET:?}
      CF_ACCOUNT_ID: ${CF_ACCOUNT_ID:-}
      CF_ZONE_ID: ${CF_ZONE_ID:-}
      CF_API_TOKEN: ${CF_API_TOKEN:-}
      CF_KV_NAMESPACE_ID: ${CF_KV_NAMESPACE_ID:-}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-}
      RESEND_API_KEY: ${RESEND_API_KEY:-}
      EMAIL_FROM: ${EMAIL_FROM:-Short <noreply@short.ky>}
      STRIPE_SECRET_KEY: ${STRIPE_SECRET_KEY:-}
      STRIPE_WEBHOOK_SECRET: ${STRIPE_WEBHOOK_SECRET:-}
      SERVICE_URL_WEB_3000: ${SERVICE_URL_WEB_3000:-}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      clickhouse:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    labels:
      - traefik.enable=true
      - traefik.http.routers.short-web.rule=Host(`app.short.ky`) || Host(`www.short.ky`)
      - traefik.http.routers.short-web.entrypoints=https
      - traefik.http.routers.short-web.tls=true
      - traefik.http.routers.short-web.tls.certresolver=letsencrypt
      - traefik.http.routers.short-web-http.rule=Host(`app.short.ky`) || Host(`www.short.ky`)
      - traefik.http.routers.short-web-http.entrypoints=http
      - traefik.http.services.short-web.loadbalancer.server.port=3000
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      start_period: 40s
      retries: 3

  migrate:
    build:
      context: .
      dockerfile: infra/Dockerfile.migrate
    restart: "no"
    exclude_from_hc: true
    environment:
      DATABASE_URL: postgres://short:${POSTGRES_PASSWORD:?}@postgres:5432/short
      CLICKHOUSE_URL: http://clickhouse:8123
      CLICKHOUSE_DATABASE: short
      CLICKHOUSE_USER: default
      CLICKHOUSE_PASSWORD: ${CLICKHOUSE_PASSWORD:?}
    depends_on:
      postgres:
        condition: service_healthy
      clickhouse:
        condition: service_healthy

  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: short
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?}
      POSTGRES_DB: short
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U short -d short"]
      interval: 10s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command:
      - redis-server
      - --requirepass
      - ${REDIS_PASSWORD:?}
      - --maxmemory
      - 512mb
      - --maxmemory-policy
      - allkeys-lru
      - --appendonly
      - "no"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a \"$$REDIS_PASSWORD\" ping | grep -q PONG"]
      interval: 10s
      timeout: 5s
      retries: 10
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:?}

  clickhouse:
    image: clickhouse/clickhouse-server:25.3-alpine
    restart: unless-stopped
    environment:
      CLICKHOUSE_DB: short
      CLICKHOUSE_USER: default
      CLICKHOUSE_PASSWORD: ${CLICKHOUSE_PASSWORD:?}
      CLICKHOUSE_DEFAULT_ACCESS_MANAGEMENT: "1"
      SERVICE_URL_CLICKHOUSE_8123: ${SERVICE_URL_CLICKHOUSE_8123:-}
    ulimits:
      nofile:
        soft: 262144
        hard: 262144
    volumes:
      - clickhouse-data:/var/lib/clickhouse
      - clickhouse-logs:/var/log/clickhouse-server
      - ./infra/clickhouse/config.d:/etc/clickhouse-server/config.d:ro
      - ./infra/clickhouse/users.d:/etc/clickhouse-server/users.d:ro
    labels:
      - traefik.enable=true
      - traefik.http.routers.short-ch.rule=Host(`ch.short.ky`)
      - traefik.http.routers.short-ch.entrypoints=https
      - traefik.http.routers.short-ch.tls=true
      - traefik.http.routers.short-ch.tls.certresolver=letsencrypt
      - traefik.http.routers.short-ch-http.rule=Host(`ch.short.ky`)
      - traefik.http.routers.short-ch-http.entrypoints=http
      - traefik.http.services.short-ch.loadbalancer.server.port=8123
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://127.0.0.1:8123/ping"]
      interval: 15s
      timeout: 5s
      retries: 10

volumes:
  postgres-data:
  redis-data:
  clickhouse-data:
  clickhouse-logs:
