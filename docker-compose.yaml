# Coolify compose for stateful origin services.
# Native Coolify DBs already exist (short.ky-pg, shared-redis). Keep these
# compose services until a dump/restore cutover; shrinking this file before
# that delete production volumes on the next compose deploy.
# The Next.js panel is a separate Coolify Dockerfile resource.
#
# These services share the external `coolify` network with every other app on the
# server, so the passwords are the only barrier: `${VAR:?}` fails the deploy instead of
# booting Postgres/Redis/ClickHouse without one.

services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: short
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
      POSTGRES_DB: short
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U short -d short"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks:
      default:
        aliases:
          - short-postgres

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: redis-server --requirepass ${REDIS_PASSWORD:?REDIS_PASSWORD is required} --maxmemory 512mb --maxmemory-policy allkeys-lru
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:?REDIS_PASSWORD is required}
    volumes:
      - redis-data:/data
    networks:
      default:
        aliases:
          - short-redis

  clickhouse:
    image: clickhouse/clickhouse-server:25.3-alpine
    restart: unless-stopped
    environment:
      CLICKHOUSE_DB: short
      CLICKHOUSE_USER: default
      CLICKHOUSE_PASSWORD: ${CLICKHOUSE_PASSWORD:?CLICKHOUSE_PASSWORD is required}
      CLICKHOUSE_DEFAULT_ACCESS_MANAGEMENT: "1"
    volumes:
      - clickhouse-data:/var/lib/clickhouse
      - clickhouse-logs:/var/log/clickhouse-server
    networks:
      default:
        aliases:
          - short-clickhouse

volumes:
  postgres-data:
  redis-data:
  clickhouse-data:
  clickhouse-logs:

networks:
  default:
    name: coolify
    external: true
